name: platform

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: ${WWW_UID:-1000}
        GID: ${WWW_GID:-1000}
    volumes:
      - .:/var/www/html:z
    environment:
      PHP_IDE_CONFIG: serverName=platform
    depends_on:
      mysql:
        condition: service_healthy
    networks: [platform]

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro,z
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on: [app]
    networks: [platform]

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "33060:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    networks: [platform]

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  # Catches every outbound message in development. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [platform]

  # S3-compatible object storage. Same driver as production.
  # Silo is Pigsty's maintained fork of the MinIO server: upstream MinIO no longer publishes
  # community images. Same S3 API, MINIO_* variables, `mc` client and on-disk format.
  silo:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo-data:/data
    networks: [platform]

  # Creates the bucket once, then exits.
  silo-init:
    image: pgsty/mc:latest
    depends_on: [silo]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://silo:9000 platform platform-secret; do sleep 1; done;
      mc mb --ignore-existing local/platform;
      mc anonymous set none local/platform;
      exit 0;
      "
    networks: [platform]

  # ── Optional profiles ────────────────────────────────────────────────────────
  # Enable only when testing behaviour that needs them:
  #   docker compose --profile scale up -d
  redis:
    image: redis:7-alpine
    profiles: [scale]
    ports:
      - "63790:6379"
    networks: [platform]

  #   docker compose --profile automation up -d 
  n8n:
    image: n8nio/n8n:latest
    profiles: [automation]
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [platform]

  #   docker compose run --rm node npm install -D some-package
  #   docker compose --profile assets up -d node
  node:
    image: node:22-alpine
    profiles: [assets]
    working_dir: /var/www/html
    user: "${WWW_UID:-1000}:${WWW_GID:-1000}"
    volumes:
      - .:/var/www/html:z
    ports:
      - "5173:5173"
    environment:
      npm_config_cache: /tmp/npm
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks: [platform]

volumes:
  db-data:
  silo-data:
  n8n-data:

networks:
  platform:
    driver: bridge
