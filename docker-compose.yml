name: platform

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      PHP_IDE_CONFIG: serverName=platform
    depends_on:
      mysql:
        condition: service_healthy
    networks: [platform]

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [platform]

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "33060:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    networks: [platform]

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  # Catches every outbound message in development. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [platform]

  # S3-compatible object storage. Same driver as production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [platform]

  # Creates the bucket once, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 platform platform-secret; do sleep 1; done;
      mc mb --ignore-existing local/platform;
      mc anonymous set none local/platform;
      exit 0;
      "
    networks: [platform]

  # ── Optional profiles ────────────────────────────────────────────────────────
  # Enable only when testing behaviour that needs them:
  #   docker compose --profile scale up -d
  redis:
    image: redis:7-alpine
    profiles: [scale]
    ports:
      - "63790:6379"
    networks: [platform]

  #   docker compose --profile automation up -d 
  n8n:
    image: n8nio/n8n:latest
    profiles: [automation]
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [platform]

volumes:
  db-data:
  minio-data:
  n8n-data:

networks:
  platform:
    driver: bridge
