memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 25M
max_execution_time = 120
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Never leak stack traces containing personal data (SL-SEC-004 §7.2)
display_errors = Off
log_errors = On
error_log = /dev/stderr
