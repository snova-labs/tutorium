name: Deploy to staging

# The button that puts a commit on staging: Actions → Deploy to staging → Run workflow.
#
# 1. Checks CI passed on the chosen commit (main by default).
# 2. Builds the images from it (Images workflow): ...:sha-<7> and ...:staging.
# 3. Points the staging branch at it, plus one commit that pins the staging stack to that exact
#    image tag.
#
# The Portainer staging stack follows the staging branch with GitOps polling (Portainer CE has no
# webhooks for stacks). The branch moves only after the images exist, and every deploy has a new
# tag, so the poll that notices it always pulls the new images. To go back, run this again with an
# older commit or tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (main for the latest merged work)
        required: true
        default: main

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  check:
    name: Check the commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the commit
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify "origin/${REF}^{commit}" 2>/dev/null || git rev-parse --verify "${REF}^{commit}")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Deploying \`${REF}\` → ${sha::7}: $(git log -1 --format=%s "$sha")" >> "$GITHUB_STEP_SUMMARY"

      - name: Check CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on ${SHA::7}. Wait for CI on that commit (or fix it), then deploy again."
            exit 1
          fi

  images:
    name: Build
    needs: check
    uses: ./.github/workflows/images.yml
    with:
      sha: ${{ needs.check.outputs.sha }}
    secrets: inherit

  branch:
    name: Move the staging branch
    needs: [check, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Pin the stack to this build and point staging at it
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          tag="sha-${SHA::7}"
          # Only the staging branch carries this commit. main keeps ${IMAGE_TAG:-staging}, which is
          # what production's stack (IMAGE_TAG=production) reads.
          sed -i "s/\${IMAGE_TAG:-staging}/${tag}/g" deploy/portainer/stack.yml
          grep -q "tutorium-api}:${tag}" deploy/portainer/stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "deploy: staging runs ${tag}" -m "Built from ${SHA}."
          # Forced: the staging branch is only ever a pointer to what staging runs, so going back
          # to an older commit is a normal deploy, not a rewrite of anyone's work.
          git push --force origin HEAD:refs/heads/staging
          {
            echo "Staging branch → ${tag}. Portainer picks it up on its next poll (within the stack's interval)."
          } >> "$GITHUB_STEP_SUMMARY"
