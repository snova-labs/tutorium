name: Promote to production

# Points ...:production at an image that already ran on staging. Nothing is rebuilt, so production
# runs exactly the bytes that were tested. Afterwards: Portainer → Stacks → sajilo → Pull and
# redeploy (with re-pull). To roll back, promote an older sha-xxxxxxx tag the same way.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to promote: staging (what staging runs now) or a sha-xxxxxxx tag"
        required: true
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag api and web as production
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^(staging|sha-[0-9a-f]{7})$ ]] || { echo "::error::Use staging or sha-xxxxxxx"; exit 1; }
          for image in api web; do
            name="ghcr.io/${OWNER,,}/tutorium-${image}"
            docker buildx imagetools create --tag "${name}:production" "${name}:${TAG}"
            digest=$(docker buildx imagetools inspect "${name}:production" --format '{{json .Manifest.Digest}}')
            revision=$(docker buildx imagetools inspect "${name}:production" --format '{{json .Image.Config.Labels}}' | grep -o '"org.opencontainers.image.revision":"[0-9a-f]*"' | cut -d'"' -f4 || true)
            echo "- ${image}: \`${name}:production\` ← \`${TAG}\` (${digest}, commit ${revision:-unknown})" >> "$GITHUB_STEP_SUMMARY"
          done
