name: Images

# Builds the deployable images from the staging branch and tags them "staging", then asks Portainer
# to redeploy the staging stack. Two ways in:
#   - Actions → "Deploy to staging" (deploy-staging.yml): moves the staging branch to a commit whose
#     CI passed, then calls this workflow. The usual way.
#   - A push to the staging branch by a person: CI runs on it, and this runs once CI is green.
# Pull requests that change how the images are built get the same ARM build, without pushing, so a
# broken build is found before it reaches main.
# Production runs ...:production, which only "Promote to production" moves (to an image staging
# has already run).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_call:
    inputs:
      sha:
        description: Commit to build
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/docker/**
      - .dockerignore
      - web/.dockerignore
      - composer.json
      - composer.lock
      - package-lock.json
      - web/package-lock.json
      - web/next.config.ts
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

concurrency:
  # Pushes to the registry queue behind each other; a PR's check build is replaced by its next push.
  group: images-${{ github.event_name == 'pull_request' && github.ref || 'staging' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.image }} (linux/arm64)
    # Only after a green CI run on a push to staging (not on a PR run that targets it).
    if: >-
      inputs.sha != '' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Emulated ARM on the standard runner by default. If native ARM runners are available to this
    # repository, set the repository variable IMAGE_RUNNER=ubuntu-24.04-arm for much faster builds.
    runs-on: ${{ vars.IMAGE_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: deploy/docker/api.Dockerfile
          - image: web
            context: web
            file: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          name="ghcr.io/${OWNER,,}/tutorium-${{ matrix.image }}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tags=${name}:staging,${name}:sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          # A pull request only proves the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.tags }}\`" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"

  redeploy:
    name: Redeploy staging in Portainer
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The staging stack's webhook (Portainer → Stacks → tutorium-staging → GitOps updates →
      # Webhook), saved as the repository secret PORTAINER_STAGING_WEBHOOK. Without it, redeploy
      # by hand: Stacks → tutorium-staging → Pull and redeploy, with Re-pull image.
      - name: Call the stack webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_STAGING_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::PORTAINER_STAGING_WEBHOOK is not set. Redeploy in Portainer: Stacks → tutorium-staging → Pull and redeploy (Re-pull image)."
            exit 0
          fi
          curl -fsS -X POST --max-time 60 "$WEBHOOK"
          echo "Portainer is pulling the new images and redeploying staging." >> "$GITHUB_STEP_SUMMARY"
