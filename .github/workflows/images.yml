name: Images

# Builds the deployable linux/arm64 images and tags them "staging" and "sha-<7>". Called by
# "Deploy to staging" (deploy-staging.yml), which then points the staging branch at the new tag.
# Pull requests that change how the images are built get the same build, without pushing, so a
# broken build is found before it reaches main.
# Production runs ...:production, which only "Promote to production" moves (to an image staging
# has already run).

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/docker/**
      - .dockerignore
      - web/.dockerignore
      - composer.json
      - composer.lock
      - package-lock.json
      - web/package-lock.json
      - web/next.config.ts
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

concurrency:
  # Pushes to the registry queue behind each other; a PR's check build is replaced by its next push.
  group: images-${{ github.event_name == 'pull_request' && github.ref || 'staging' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.image }} (linux/arm64)
    # Emulated ARM on the standard runner by default. If native ARM runners are available to this
    # repository, set the repository variable IMAGE_RUNNER=ubuntu-24.04-arm for much faster builds.
    runs-on: ${{ vars.IMAGE_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: deploy/docker/api.Dockerfile
          - image: web
            context: web
            file: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          name="ghcr.io/${OWNER,,}/tutorium-${{ matrix.image }}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tags=${name}:staging,${name}:sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          # A pull request only proves the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.tags }}\`" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"

